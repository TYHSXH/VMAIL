parameters:
  mass:
    value: 1.0
    unit: kg
    min: 0.2
    max: 5.0
    step: 0.1
    description: 滑块质量。
    mjcf:
      tag: geom
      name: slider_geom
      attribute: mass
    label: 质量
  stiffness:
    value: 12.0
    unit: N/m
    min: 1.0
    max: 60.0
    step: 1.0
    description: 滑动关节的等效弹簧刚度。
    mjcf:
      tag: joint
      name: slide_x
      attribute: stiffness
    label: 刚度
  damping:
    value: 0.8
    unit: N*s/m
    min: 0.0
    max: 8.0
    step: 0.1
    description: 滑动关节的等效阻尼。
    mjcf:
      tag: joint
      name: slide_x
      attribute: damping
    label: 阻尼
  initial_displacement:
    value: 0.6
    unit: m
    min: -1.2
    max: 1.2
    step: 0.05
    description: 滑块初始位移。
    initial_state:
      joint: slide_x
      field: qpos
    label: 初始位移
  initial_velocity:
    value: 0.0
    unit: m/s
    min: -5.0
    max: 5.0
    step: 0.1
    description: 滑块初始速度。
    initial_state:
      joint: slide_x
      field: qvel
    label: 初始速度
